name: grid-repair

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-grid-repair}-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-app_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-33060}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # 结构脚本兜底（与 backend/prisma/migrations 等价）；仅首次初始化空库时执行
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-app_password}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-grid-repair}-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DRIVER: prisma
      DATABASE_URL: mysql://${DB_USER:-app_user}:${DB_PASSWORD:-app_password}@db:3306/${DB_NAME:-app_db}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-app_db}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
    ports:
      - "${BACKEND_PORT:-21104}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-grid-repair}-frontend
    ports:
      - "${FRONTEND_PORT:-20104}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME:-grid-repair}_db_data
